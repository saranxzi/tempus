<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempus — Time Tracker</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <!-- ═══ Custom Title Bar ════════════════════════════════════════════════ -->
  <div id="titlebar">
    <span class="title-text">⏱ Tempus</span>
    <div class="window-controls">
      <button id="btn-minimize" data-tooltip="Minimize">─</button>
      <button id="btn-maximize" data-tooltip="Maximize">□</button>
      <button id="btn-close" class="close" data-tooltip="Close">✕</button>
    </div>
  </div>

  <!-- ═══ App Shell ═══════════════════════════════════════════════════════ -->
  <div id="app">
    <nav id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Menu</div>
        <button class="nav-item active" data-view="dashboard"><span class="icon">📊</span>Dashboard</button>
        <button class="nav-item" data-view="time-tracking"><span class="icon">📋</span>Time Log</button>
        <button class="nav-item" data-view="stopwatch"><span class="icon">⏱️</span>Stopwatch</button>
        <button class="nav-item" data-view="pomodoro"><span class="icon">🍅</span>Pomodoro</button>
        <button class="nav-item" data-view="analytics"><span class="icon">📈</span>Analytics</button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Manage</div>
        <button class="nav-item" data-view="tasks"><span class="icon">🗂️</span>Tasks</button>
        <button class="nav-item" data-view="settings"><span class="icon">⚙️</span>Settings</button>
      </div>
    </nav>
    <main id="main-content"></main>
  </div>

  <!-- ═══ Mini Stopwatch (floating mode) ═════════════════════════════════ -->
  <div id="mini-stopwatch" class="mini-stopwatch">
    <div class="mini-info">
      <div class="mini-task-name" id="mini-task-name">—</div>
      <div class="mini-time" id="mini-time">00:00:00</div>
    </div>
    <button class="btn btn-sm btn-ghost" id="mini-pause" title="Start / pause">▶</button>
    <button class="btn btn-sm btn-danger" id="mini-stop" title="Stop &amp; save">⏹</button>
    <button class="btn btn-sm btn-ghost" id="mini-pin" title="Unpin from top">📍</button>
    <button class="btn btn-sm btn-ghost" id="mini-expand" title="Back to full window">⤢</button>
  </div>

  <div id="modal-root"></div>

  <script src="main.js"></script>
</body>
</html>
